<style>
.fixed-scroll-btn {
    position: fixed !important;
    right: 25px !important;
    bottom: 25px !important;
    width: 38px !important;
    height: 38px !important;
    background-color: #3b52f6 !important;
    border: none !important;
    border-radius: 6px !important;
    color: #ffffff !important;
    cursor: pointer !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 0 !important;
    z-index: 9999 !important;
    opacity: 0 !important;
    pointer-events: none !important;
    transition: opacity 0.3s ease, background-color 0.2s ease, transform 0.3s ease !important;
    transform: translateY(10px);
}
.fixed-scroll-btn.show {
    opacity: 0.30 !important; /* 🚀 يرجع شفاف خفيف على الموبايل والكمبيوتر فوراً */
    pointer-events: auto !important;
    transform: translateY(0);
}

/* 🚀 الخدعة السحرية: الـ hover يشتغل فقط على الأجهزة اللي فيها ماوس (الكمبيوتر) */
@media (hover: hover) {
    .fixed-scroll-btn.show:hover {
        opacity: 1 !important;
        background-color: #2563eb !important;
    }
}

/* 🚀 يتلون فقط لحظة الضغط الفعلي بصباعك على الموبايل (Active) */
.fixed-scroll-btn:active {
    opacity: 1 !important;
    background-color: #2563eb !important;
}

/* إلغاء أي ألوان ثابتة أو تحديد بعد الضغط تماماً */
.fixed-scroll-btn:focus, .fixed-scroll-btn:focus-visible {
    outline: none !important;
    background-color: #3b52f6 !important;
}
</style>

<!-- 🧠 كود الحركة السحرية: تمنع العناد تماماً وترجع الشفافية فوراً -->
<script>
let scrollInterval = null;
let lastScrollTop = 0;

function smoothScrollToTop() {
    if (scrollInterval) clearInterval(scrollInterval);
    
    lastScrollTop = document.documentElement.scrollTop || document.body.scrollTop;
    
    // ⏳ حركة السلو موشن الانسيابية (وحدة وحدة)
    scrollInterval = setInterval(function() {
        var currentScroll = document.documentElement.scrollTop || document.body.scrollTop;
        
        if (currentScroll > 0) {
window.scrollTo(0, currentScroll - Math.max(1, currentScroll / 24));
            lastScrollTop = currentScroll; // تحديث آخر نقطة صعود وصل لها الكود
        } else {
            stopScrollAnimation();
        }
    }, 12);
}

function stopScrollAnimation() {
    if (scrollInterval) {
        clearInterval(scrollInterval);
        scrollInterval = null;
    }
}

// 🚀 الحساس الأقوى على الإطلاق: لو المستخدم حاول ينزل بالفأرة ويعاند الصعود، نقفل التايمر فوراً!
window.addEventListener('scroll', function() {
    var currentScroll = document.documentElement.scrollTop || document.body.scrollTop;
    
    // لو التايمر شغال والمستخدم بيسحب لتحت (يعني الحالي أكبر من اللي فات)، نوقف الحركة فوراً
    if (scrollInterval && currentScroll > lastScrollTop) {
        stopScrollAnimation();
    }
    
    // كود تفعيل ظهور واختفاء الزرار التلقائي في أول الصفحة
    var scrollBtn = document.getElementById('scrollToTopBtn');
    if (scrollBtn) {
        if (currentScroll > 200) {
            scrollBtn.classList.add('show');
        } else {
            scrollBtn.classList.remove('show');

        WebViewer({

            licenseKey: '5jqmC560cL7nFPCnhsz8'
        }, document.getElementById('viewer'))
            .then(instance => {
                console.log("Viewer is Ready with images and no watermark!");

                // 🎯 الديسكتوب: نسبة ثابتة | الموبايل: FitWidth × نسبة
                const DESKTOP_ZOOM = 80;     // 🔧 غيّر الرقم ده (أصغر = الشهادة أنحف)
                const MOBILE_FACTOR = 0.63;  // 🔧 نسبة الموبايل من عرض العارض

                try {
                    const docViewer = instance.Core.documentViewer;
                    let applied = false;

                    const applyZoom = () => {
                        try {
                            const isMobile = window.matchMedia('(max-width: 768px)').matches;

                            if (!isMobile) {
                                docViewer.setZoomLevel(DESKTOP_ZOOM + '%');
                                return;
                            }

                            docViewer.setFitMode(docViewer.FitMode.FitWidth);
                            setTimeout(() => {
                                try {
                                    const z = docViewer.getZoomLevel();
                                    if (typeof z === 'number') {
                                        docViewer.setZoomLevel(z * MOBILE_FACTOR);
                                    } else {
                                        docViewer.setZoomLevel((MOBILE_FACTOR * 100).toFixed(0) + '%');
                                    }
                                } catch (e) {
                                    console.log('Mobile zoom skipped:', e);
                                }
                            }, 150);
                        } catch (e) {
                            console.log('Zoom setup error:', e);
                        }
                    };

                    docViewer.on('documentLoaded', () => {
                        if (applied) return;
                        applied = true;
                        applyZoom();
                    });

                    applyZoom();
                    setTimeout(() => {
                        if (!applied) { applied = true; applyZoom(); }
                    }, 600);

                    // إعادة الضبط عند تغيير مقاس الشاشة / تدوير الموبايل
                    let rz;
                    window.addEventListener('resize', () => {
                        clearTimeout(rz);
                        rz = setTimeout(applyZoom, 400);
                    });
                } catch (e) {
                    console.log('WebViewer zoom setup skipped:', e);
                }
            });
    </script>
